services:
  db:
    image: postgres:latest
    container_name: lavadero-sm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lavadero-sm-db-data:/var/lib/postgresql

  postgrest:
    image: postgrest/postgrest:latest
    container_name: lavadero-sm-postgrest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGREST_AUTHENTICATOR_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_SERVER_PORT: 3000
    ports:
      - "${POSTGREST_PORT:-3001}:3000"

volumes:
  lavadero-sm-db-data:
